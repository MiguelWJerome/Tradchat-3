<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go to Bed! — Curfew Active</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css" />
    
    <style>
        :root {
            --color-sky: #130a2a;
            --color-deep: #05020c;
            --color-violet: #8b5cf6;
            --color-violet-hover: #7c3aed;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--color-sky) 0%, var(--color-deep) 100%);
            font-family: 'Outfit', sans-serif;
            color: #e0d7ff;
            overflow: hidden;
            position: relative;
        }

        /* Star field generator */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 50px 160px, #ddd, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 80px 120px, #fff, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 110px 210px, #ddd, rgba(0,0,0,0)),
                        radial-gradient(2.5px 2.5px at 150px 90px, #fff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 190px 170px, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 300px;
            opacity: 0.4;
            z-index: 1;
        }

        /* Glowing cartoon moon */
        .moon {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #ffebae 70%, #ffd063 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 208, 99, 0.35);
            position: absolute;
            top: 12%;
            right: 15%;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }

        .moon::before {
            content: "😴";
            position: absolute;
            top: 30%;
            left: 30%;
            font-size: 24px;
            animation: snoozing 3s ease-in-out infinite;
        }

        .curfew-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 50px 40px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            z-index: 10;
            position: relative;
            animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sleepy-emoji {
            font-size: 76px;
            margin-bottom: 24px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            animation: rock 4s ease-in-out infinite;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin: 0 0 12px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            line-height: 1;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            opacity: 0.85;
            margin-bottom: 32px;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: linear-gradient(135deg, var(--color-violet) 0%, var(--color-violet-hover) 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.55);
        }

        .btn-logout:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes rock {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }

        @keyframes snoozing {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            50% { transform: scale(1.2) translate(5px, -5px); opacity: 0.4; }
        }

        @keyframes scaleUp {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="moon"></div>

    <div style="display:flex; flex-direction:column; align-items:center; z-index:10; position:relative;">
        <h2 style="color:white; font-family:'Bebas Neue', sans-serif; font-size:2.2rem; letter-spacing:3px; text-align:center; margin-bottom:18px; text-shadow: 0 0 20px rgba(255,255,255,0.15);">{{ curfew_start }} → {{ curfew_end }}</h2>
        <div class="curfew-card">
            <span class="sleepy-emoji">🛌💤</span>
            <h1>Past Your Curfew!</h1>
            <p>Sorry, but it's past your bedtime curfew. Parental locks are currently active, meaning access to the application is restricted until curfew ends. Go catch some sleep!</p>
            
            <a href="/logout/" class="btn-logout">
                <i class="fa-solid fa-sign-out-alt"></i> Log Out
            </a>
        </div>
    </div>
</body>
</html>
