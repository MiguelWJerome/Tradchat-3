{% extends "tradchat.html" %}

{% block title %}TradChat — Home{% endblock %}

{% block styles %}
  <!-- Google Fonts: Distinctive pairing — "Bebas Neue" display + "DM Sans" body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/logo.png" />

  <link rel="stylesheet" href="/static/css/home.css"        media="screen and (min-width: 769px)" />
  <link rel="stylesheet" href="/static/css/home_mobile.css"  media="screen and (max-width: 768px)" />
{% endblock %}

{% block content %}

    <!-- =================================================================
      MAIN CONTENT AREA — sidebar + chat panel
    ================================================================= -->
    <main class="main-content">

      <!-- ---------------------------------------------------------------
        LEFT SIDEBAR — messaging shortcuts + search
      --------------------------------------------------------------- -->
      <aside class="sidebar">

        <!-- Sidebar icon tray: Messenger / Open Groups / Invite Groups -->
        <div class="sidebar__tray">

          <!-- Messenger shortcut -->
          <button class="tray-item btn-sharp" aria-label="Open Messenger">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="14" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
              <path d="M6 18l3-3"/>
            </svg>
            <span class="tray-item__label">Messenger</span>
          </button>

          <!-- Divider line between tray icons -->
          <div class="tray-divider" aria-hidden="true"></div>

          <!-- Open Groups shortcut -->
          <button class="tray-item btn-sharp" aria-label="Open Groups">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="9"  cy="8"  r="3"/>
              <circle cx="17" cy="8"  r="3"/>
              <path d="M3 20c0-3.3 2.7-6 6-6"/>
              <path d="M15 14c3.3 0 6 2.7 6 6"/>
              <path d="M9 14c2 0 3.8.7 5.2 1.9"/>
            </svg>
            <span class="tray-item__label">Open<br/>Groups</span>
          </button>

          <!-- Divider line -->
          <div class="tray-divider" aria-hidden="true"></div>

          <!-- Invite Groups shortcut -->
          <button class="tray-item btn-sharp" aria-label="Invite Groups">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="9"  cy="8" r="3"/>
              <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
              <line x1="19" y1="8"  x2="19" y2="14"/>
              <line x1="16" y1="11" x2="22" y2="11"/>
            </svg>
            <span class="tray-item__label">Invite<br/>Groups</span>
          </button>
        </div>

        <!-- Search bar below the tray -->
        <div class="sidebar__search">
          <input
            type="text"
            class="search-input"
            placeholder="Search"
            aria-label="Search conversations"
          />
          <!-- Search icon inside field -->
          <button class="search-btn" aria-label="Run search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/>
              <line  x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
          </button>
        </div>

        <!-- Conversation list — populated dynamically by JS -->
        <ul class="sidebar__list" id="sidebar-list" aria-label="Conversations">
          <!-- Items injected by home.js -->
        </ul>
      </aside>

      <!-- ---------------------------------------------------------------
        CHAT PANEL — room header + messages + input bar
      --------------------------------------------------------------- -->
      <section class="chat-panel" aria-label="Chat room">

        <!-- Room header — the arrow-chevron label shown in wireframe -->
        <div class="chat-panel__header">
          <h2 class="room-title">MAINROOM</h2>
        </div>

        <!-- Scrollable message feed -->
        <div class="chat-panel__feed" id="chat-feed" role="log" aria-live="polite">
          <!-- Messages injected by home.js -->
        </div>

        <!-- Bottom input bar -->
        <div class="chat-panel__inputbar">

          <!-- Text input -->
          <input
            type="text"
            class="inputbar__text"
            id="chat-input"
            placeholder="Say something..."
            aria-label="Message input"
          />

          <!-- Accessory icon buttons -->
          <div class="inputbar__icons">

            <!-- Emoji picker trigger -->
            <button class="icon-btn btn-sharp" aria-label="Insert emoji" id="emoji-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                <line x1="9"  y1="9"  x2="9.01"  y2="9"/>
                <line x1="15" y1="9"  x2="15.01" y2="9"/>
              </svg>
            </button>

            <!-- GIF button -->
            <button class="icon-btn btn-sharp" aria-label="Insert GIF" id="gif-btn">
              <span class="gif-label">GIF</span>
            </button>

            <!-- Attachment / upload button -->
            <button class="icon-btn btn-sharp" aria-label="Upload file" id="upload-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <polyline points="16 16 12 12 8 16"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
                <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
              </svg>
            </button>
          </div>

          <!-- Send button — separated visually as in wireframe -->
          <button class="send-btn btn-sharp" id="send-btn" aria-label="Send message">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2"  x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>

        <!-- Simple emoji picker popover (hidden by default, toggled by JS) -->
        <div class="emoji-picker" id="emoji-picker" aria-hidden="true">
          <!-- Emojis injected by looks/home.js -->
        </div>
      </section>
    </main><!-- /main-content -->

{% endblock %}

{% block scripts %}
<script src="/static/javascript/tradchat.js"           defer></script>
<script src="/static/javascript/socketio.js"           defer></script>
<script src="/static/javascript/jquery.js"             defer></script>
<script src="/static/javascript/network/home.js"       defer></script>
<script src="/static/javascript/looks/home.js"         defer></script>
{% endblock %}
