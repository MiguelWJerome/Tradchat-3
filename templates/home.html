{% extends "tradchat.html" %}

{% block title %}TradChat — Home{% endblock %}

{% block styles %}
  <!-- Google Fonts: Distinctive pairing — "Bebas Neue" display + "DM Sans" body -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/logo.png" />

  <link rel="stylesheet" href="/static/css/home.css"        media="screen and (min-width: 769px)" />
  <link rel="stylesheet" href="/static/css/home_mobile.css"  media="screen and (max-width: 768px)" />
{% endblock %}

{% block content %}

    <!-- =================================================================
      MAIN CONTENT AREA — sidebar + chat panel
    ================================================================= -->
    <main class="main-content">

      <!-- ---------------------------------------------------------------
        LEFT SIDEBAR — messaging shortcuts + search
      --------------------------------------------------------------- -->
      <aside class="sidebar">

        <!-- Sidebar icon tray: Messenger / Public Rooms / Private Rooms -->
        <div class="sidebar__tray">

          <!-- Messenger shortcut -->
          <button class="tray-item" id="messenger-icon" aria-label="Open Messenger">
            <i class="fa-solid fa-envelope"></i>
            <span class="tray-item__label">Messenger</span>
          </button>

          <!-- Divider line between tray icons -->
          <div class="tray-divider" aria-hidden="true"></div>

          <!-- Public Rooms shortcut -->
          <button class="tray-item" id="public-rooms-icon" aria-label="Public Rooms">
            <i class="fa-solid fa-users"></i>
            <span class="tray-item__label">Public<br/>Rooms</span>
          </button>

          <!-- Divider line -->
          <div class="tray-divider" aria-hidden="true"></div>

          <!-- Private Rooms shortcut -->
          <button class="tray-item" id="private-rooms-icon" aria-label="Private Rooms">
            <i class="fa-solid fa-user-plus"></i>
            <span class="tray-item__label">Private<br/>Rooms</span>
          </button>
        </div>

        <!-- Sidebar action buttons -->
        <div class="sidebar__actions">
          <div class="sidebar-actions-row">
            <!-- Back to Mainroom button -->
            <button class="sidebar-action-btn back-btn" id="back-to-mainroom">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
                <line x1="9" y1="12" x2="21" y2="12"/>
              </svg>
              <span>Mainroom</span>
            </button>
            
            <!-- Create button -->
            <button class="sidebar-action-btn create-btn" id="create-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>Create</span>
            </button>
          </div>
        </div>

        <!-- Search bar -->
        <div class="sidebar__search">
          <input
            type="text"
            class="search-input"
            placeholder="Search"
            aria-label="Search conversations"
          />
          <!-- Search icon inside field -->
          <i class="fa-solid fa-magnifying-glass static-icon" id="search-icon" aria-label="Run search"></i>
        </div>

        <!-- Conversation list — populated dynamically by JS -->
        <ul class="sidebar__list" id="sidebar-list" aria-label="Conversations">
          <!-- Items injected by home.js -->
        </ul>
      </aside>

      <!-- ---------------------------------------------------------------
        CHAT PANEL — room header + messages + input bar
      --------------------------------------------------------------- -->
      <section class="chat-panel" aria-label="Chat room">

        <!-- Room header — the arrow-chevron label shown in wireframe -->
        <div class="chat-panel__header">
          <div class="convo-item__avatar" id="banner-picture">📊</div>
          <h2 class="room-title">MAINROOM</h2>
        </div>

        <!-- Scrollable message feed -->
        <div class="chat-panel__feed" id="chat-feed" role="log" aria-live="polite">
          <!-- Messages injected by home.js -->
        </div>

        <!-- Bottom input bar -->
        <div class="chat-panel__inputbar">

          <!-- Text input with nested icons -->
          <div class="input-wrapper">
            <input
              type="text"
              class="inputbar__text"
              id="chat-input"
              placeholder="Say something..."
              aria-label="Message input"
            />

            <!-- Accessory icon buttons positioned inside input -->
            <div class="inputbar__icons">

              <!-- Emoji picker trigger -->
              <i class="fa-solid fa-face-grin clickable-icon" id="emoji-btn" aria-label="Insert emoji"></i>

              <!-- GIF button -->
              <i class="fa-solid fa-gift clickable-icon" id="gif-btn" aria-label="Insert GIF"></i>

              <!-- Attachment / upload button -->
              <i class="fa-solid fa-file-arrow-up clickable-icon" id="upload-btn" aria-label="Upload file"></i>
            </div>
          </div>

          <!-- Send button — separated visually as in wireframe -->
          <i class="fa-solid fa-paper-plane clickable-icon send-icon" id="send-btn" aria-label="Send message"></i>
        </div>

        <!-- Simple emoji picker popover (hidden by default, toggled by JS) -->
        <div class="emoji-picker" id="emoji-picker" aria-hidden="true">
          <!-- Emojis injected by looks/home.js -->
        </div>
      </section>
    </main><!-- /main-content -->

{% endblock %}

{% block scripts %}
<script>
  let ROOM = '{{ room }}';
</script>
<script src="/static/javascript/tradchat.js"           defer></script>
<script src="/static/javascript/socketio.js"           defer></script>
<script src="/static/javascript/jquery.js"             defer></script>
<script src="/static/javascript/network/home.js"       defer></script>
<script src="/static/javascript/looks/home.js"         defer></script>
{% endblock %}
