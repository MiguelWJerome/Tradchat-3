<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Admin - TradChat</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/gif_approve.css" />
</head>
<body>
    <!-- Username data for JS -->
    <div id="username-data" data-username="{{ username }}" style="display: none;"></div>

    <div class="gif-admin-container">
        <div class="gif-admin-header">
            <h1>GIF Admin Portal</h1>
            <p>Manage your local GIF database.</p>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="add">Add GIFs</button>
            <button class="admin-tab-btn" data-tab="edit">Edit/Delete GIFs</button>
        </div>

        <div id="gif-status-msg" class="gif-status-msg"></div>

        <!-- Add GIFs Tab -->
        <div id="add-tab" class="tab-content active">
            <div class="gif-search-box">
                <input type="text" id="gif-search-input" placeholder="Search GIPHY to add new GIFs...">
                <select id="gif-rating-select">
                    <option value="g" selected>G</option>
                    <option value="pg">PG</option>
                    <option value="pg-13">PG-13</option>
                </select>
                <input type="number" id="gif-limit-input" value="50" min="1" max="100">
                <button id="gif-search-btn">Search GIPHY</button>
            </div>
            <div class="gif-results" id="gif-results"></div>
        </div>

        <!-- Edit/Delete GIFs Tab -->
        <div id="edit-tab" class="tab-content">
            <div class="gif-search-box">
                <input type="text" id="edit-search-input" placeholder="Search your whitelisted GIFs by keyword...">
                <button id="edit-search-btn">Search Database</button>
            </div>
            <div class="gif-results" id="edit-results"></div>
        </div>
    </div>

    <script src="/static/javascript/socketio.js"></script>
    <script src="/static/javascript/jQuery.js"></script>
    <script src="/static/javascript/network/gif_approve.js"></script>
    <script src="/static/javascript/looks/gif_approve.js"></script>
</body>
</html>
