<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TradChat{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/logo.png" />
    
    <!-- CSS -->
    {% block styles %}{% endblock %}
    
    <!-- Base TradChat CSS -->
    <link rel="stylesheet" href="/static/css/tradchat.css" />
    
    <style>
    :root {
      --color-light  : {{ color_light }};   
      --color-medium : {{ color_medium }};   
      --color-dark   : {{ color_dark }};   

      --color-accent : #C0392B;   /* classic trading-floor red accent */
      --color-panel  : #DAD4CA;   /* warmer panel background */
      --color-border : #9E9589;   /* border / divider tone    */

      --font-display : 'Playfair Display', sans-serif;
      --font-body    : 'DM Sans',   sans-serif;

      --radius-soft  : 999px;     /* pill / bubbly shape     */
      --radius-sharp : 0px;       /* sharp rectangular shape */
      --radius-card  : 6px;       /* cards and panels        */

      --transition   : 0.18s ease;
    }

    /* ---- Universal Reset ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: url('/static/themes/{{ theme }}/background.jpg') center/cover;
      background-attachment: fixed;
      color: var(--color-dark);
      font-family: var(--font-body);
      min-height: 100vh;
      position: relative;
    }

    /* White overlay with 0.7 opacity */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      z-index: -1;
      pointer-events: none;
    }

    /* ====================================================
       SHARED BUTTON CLASSES
       .btn-sharp   : hard rectangular button (no radius)
       .btn-soft    : slightly rounded button
       .btn-bubbly  : fully pill-shaped button
    ==================================================== */
    .btn-sharp, .btn-soft, .btn-bubbly {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 2px solid var(--color-dark);
      background: transparent;
      color: var(--color-dark);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      transition: background var(--transition), color var(--transition);
    }
    .btn-sharp  { border-radius: var(--radius-sharp); }
    .btn-soft   { border-radius: var(--radius-card);  }
    .btn-bubbly { border-radius: var(--radius-soft);  }

    /* Active / hover states for all buttons */
    .btn-sharp:hover, .btn-soft:hover, .btn-bubbly:hover,
    .btn-sharp.active, .btn-soft.active, .btn-bubbly.active {
      background: var(--color-dark);
      color: var(--color-light);
    }
    </style>
</head>
<body>
  <div class="app-shell">
    <!-- NAV BAR -->
    {% block navbar %}
    <nav class="navbar">
      <!-- Left side: Logo + brand name -->
      <div class="navbar-brand">
        <!-- Logo image -->
        <img class="navbar-logo-img" src="/static/logo.png" alt="TradChat Logo" width="38" height="38">
        <span class="navbar-brand-name">TradChat</span>
      </div>

      <!-- Burger menu button (hidden on desktop) -->
      <button class="navbar-burger" id="burgerMenu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Center: Navigation options -->
      <div class="navbar-nav" id="navbarNav">
        <button class="nav-item {% if active_page == 'home' %}active{% endif %}" data-page="mainroom" onclick="window.location.href='/home/'">Home</button>
        <button class="nav-item {% if active_page == 'members' %}active{% endif %}" data-page="members" onclick="window.location.href='/members/'">Members</button>
        <button class="nav-item" data-page="games">Games</button>
        <button class="nav-item" data-page="events">Events</button>
        <button class="nav-item" data-page="news">News</button>
        <button class="nav-item" data-page="policy">Policy</button>
        <button class="nav-item {% if active_page == 'report' %}active{% endif %}" onclick="window.location.href='/report/'">Report</button>
        <a href="/logout/" class="nav-item logout-btn">Logout</a>
        {% if is_admin_user %}
        <a href="/admin/" class="nav-item admin-nav-btn {% if active_page == 'admin' %}active{% endif %}" style="position: relative;">
          Admin
          <span class="navbar-alert-dot" id="navbar-admin-dot" {% if not has_unseen_actions %}style="display: none;"{% endif %}></span>
        </a>
        {% endif %}
      </div>

      <!-- Right side: Profile account section -->
      <div class="navbar-button-group" id="navbarAccount">
        <!-- Profile account with settings -->
        <button class="navbar-profile-button {% if active_page == 'settings' %}active{% endif %}" onclick="window.location.href='/settings/'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>

      <!-- Mobile dropdown menu -->
      <div class="navbar-dropdown" id="navbarDropdown">
        <div class="dropdown-section">
          <h3>Navigation</h3>
          <button class="dropdown-item {% if active_page == 'home' %}active{% endif %}" data-page="mainroom" onclick="window.location.href='/home/'">Home</button>
          <button class="dropdown-item {% if active_page == 'members' %}active{% endif %}" data-page="members" onclick="window.location.href='/members/'">Members</button>
          <button class="dropdown-item" data-page="games">Games</button>
          <button class="dropdown-item" data-page="events">Events</button>
          <button class="dropdown-item" data-page="news">News</button>
          <button class="dropdown-item" data-page="policy">Policy</button>
          <button class="dropdown-item {% if active_page == 'report' %}active{% endif %}" onclick="window.location.href='/report/'">Report</button>
          <a href="/logout/" class="dropdown-item logout-dropdown-btn">Logout</a>
          {% if is_admin_user %}
          <a href="/admin/" class="dropdown-item admin-dropdown-btn {% if active_page == 'admin' %}active{% endif %}" style="position: relative;">
            Admin
            <span class="navbar-alert-dot" id="navbar-admin-dropdown-dot" {% if not has_unseen_actions %}style="display: none;"{% endif %}></span>
          </a>
          {% endif %}
        </div>
        <div class="dropdown-section">
          <h3>Account</h3>
          <button class="dropdown-item profile-dropdown {% if active_page == 'settings' %}active{% endif %}" onclick="window.location.href='/settings/'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            Settings
          </button>
        </div>
      </div>
    </nav>
    {% endblock %}

    <!-- MAIN CONTENT -->
    {% block content %}{% endblock %}
  </div>

  <!-- JAVASCRIPT -->
  {% block scripts %}{% endblock %}
  
  <script>
    // Navbar burger menu functionality
    const burgerMenu = document.getElementById('burgerMenu');
    const navbarDropdown = document.getElementById('navbarDropdown');
    const navbarNav = document.getElementById('navbarNav');
    const navbarAccount = document.getElementById('navbarAccount');
    let isDropdownOpen = false;

    // Toggle dropdown menu
    burgerMenu.addEventListener('click', function() {
      isDropdownOpen = !isDropdownOpen;
      if (isDropdownOpen) {
        navbarDropdown.classList.add('show');
      } else {
        navbarDropdown.classList.remove('show');
      }
    });

    // Handle dropdown item clicks
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', function() {
        const page = this.getAttribute('data-page');
        if (page) {
          // Trigger the same navigation as regular nav items
          document.querySelector(`.nav-item[data-page="${page}"]`).click();
        }
        // Close dropdown
        isDropdownOpen = false;
        navbarDropdown.classList.remove('show');
      });
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      if (!burgerMenu.contains(event.target) && !navbarDropdown.contains(event.target)) {
        isDropdownOpen = false;
        navbarDropdown.classList.remove('show');
      }
    });

    // Check screen width and toggle visibility
    function checkScreenSize() {
      if (window.innerWidth <= 768) {
        burgerMenu.style.display = 'block';
        navbarNav.style.display = 'none';
        navbarAccount.style.display = 'none';
      } else {
        burgerMenu.style.display = 'none';
        navbarNav.style.display = 'flex';
        navbarAccount.style.display = 'flex';
        // Close dropdown if open
        isDropdownOpen = false;
        navbarDropdown.classList.remove('show');
      }
    }

    // Initial check and listen for resize
    checkScreenSize();
    window.addEventListener('resize', checkScreenSize);
  </script>
</body>
</html>
