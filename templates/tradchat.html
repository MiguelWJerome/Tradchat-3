<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TradChat{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- CSS -->
    {% block styles %}{% endblock %}
    
    <style>
    :root {
      --color-light  : {{ color_ligth }};   
      --color-medium : {{ color_medium }};   
      --color-dark   : {{ color_dark }};   

      --color-accent : #C0392B;   /* classic trading-floor red accent */
      --color-panel  : #DAD4CA;   /* warmer panel background */
      --color-border : #9E9589;   /* border / divider tone    */

      --font-display : 'Bebas Neue', sans-serif;
      --font-body    : 'DM Sans',   sans-serif;

      --radius-soft  : 999px;     /* pill / bubbly shape     */
      --radius-sharp : 0px;       /* sharp rectangular shape */
      --radius-card  : 6px;       /* cards and panels        */

      --transition   : 0.18s ease;
    }

    /* ---- Universal Reset ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: url('/static/themes/{{ theme }}.jpg') center/cover;
      background-attachment: fixed;
      color: var(--color-dark);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* ====================================================
       SHARED BUTTON CLASSES
       .btn-sharp   : hard rectangular button (no radius)
       .btn-soft    : slightly rounded button
       .btn-bubbly  : fully pill-shaped button
    ==================================================== */
    .btn-sharp, .btn-soft, .btn-bubbly {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 2px solid var(--color-dark);
      background: transparent;
      color: var(--color-dark);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      transition: background var(--transition), color var(--transition);
    }
    .btn-sharp  { border-radius: var(--radius-sharp); }
    .btn-soft   { border-radius: var(--radius-card);  }
    .btn-bubbly { border-radius: var(--radius-soft);  }

    /* Active / hover states for all buttons */
    .btn-sharp:hover, .btn-soft:hover, .btn-bubbly:hover,
    .btn-sharp.active, .btn-soft.active, .btn-bubbly.active {
      background: var(--color-dark);
      color: var(--color-light);
    }
    </style>
</head>
<body>
  <div class="app-shell">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar__left">
        <img src="/static/logo.png" alt="TRADCHAT Logo" class="topbar__logo-img">
        <span class="topbar__logo">TRADCHAT</span>
        <button class="hamburger-toggle" id="hamburger-toggle" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="topbar__right">
        <button class="topbar__profile btn-sharp" aria-label="User profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- NAV BAR -->
    {% block navbar %}
    <nav class="navbar" aria-label="Main navigation">
      <button class="btn-bubbly nav-tab active" data-section="mainroom">Mainroom</button>
      <button class="btn-bubbly nav-tab"         data-section="members" >Members</button>
      <button class="btn-bubbly nav-tab"         data-section="games"   >Games</button>
      <button class="btn-bubbly nav-tab"         data-section="events"  >Events</button>
      <button class="btn-bubbly nav-tab"         data-section="news"    >News</button>
      <button class="btn-bubbly nav-tab"         data-section="policy"  >Policy</button>
      <button class="btn-bubbly nav-tab"         data-section="logout"  >Log Out</button>
    </nav>
    {% endblock %}

    <!-- MAIN CONTENT -->
    {% block content %}{% endblock %}
  </div>

  <!-- JAVASCRIPT -->
  {% block scripts %}{% endblock %}
</body>
</html>
